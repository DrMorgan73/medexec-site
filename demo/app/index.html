<html lang="en">
<head>
<meta charset="utf-8">

<title>MedExec Demo — Clinical Operations Dashboard (Synthetic Data)</title>
<style>
:root{
  --navy:#101b36;--navy-2:#16234a;--teal:#1e9e86;--teal-dark:#157a68;
  --bg:#eef2f7;--card:#ffffff;--line:#dce3ec;--ink:#101b36;--ink-soft:#5b6b85;
  --amber-bg:#fdf3dc;--amber-line:#f0dba0;--danger:#c2453a;
  --radius:12px;--radius-sm:8px;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --shadow-sm:0 1px 2px rgba(16,27,54,.06);--shadow-md:0 4px 16px rgba(16,27,54,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5}
a{color:#3457D5}
.app-shell{display:flex;min-height:100vh}
.app-sidebar{width:230px;flex:0 0 230px;background:var(--navy);color:#c7d0e3;padding:22px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-weight:700;font-size:17px}
.brand-name{font-family:var(--serif);font-weight:700;font-size:16px;color:#fff;line-height:1.1}
.brand-tag{font-size:8.5px;letter-spacing:.09em;color:#8ce0ce}
.nav-link{display:block;padding:9px 10px;border-radius:8px;font-size:13.5px;color:#c7d0e3;text-decoration:none;cursor:pointer;margin-bottom:2px;border:0;background:none;width:100%;text-align:left;font-family:var(--sans)}
.nav-link:hover{color:#fff}
.nav-link.active{background:rgba(30,158,134,.16);color:#fff;font-weight:600}
.pilot-card{background:#132247;border:1px solid #223662;border-radius:9px;padding:10px 12px;font-size:11.5px;color:#9db0d6;margin-top:16px;line-height:1.45}
.pilot-card .dot{color:var(--teal)}
.sidebar-foot{margin-top:auto;padding-top:16px}
.status-light{font-size:11.5px;color:#9db0d6;margin-bottom:12px}
.status-light .dot{color:var(--teal)}
.user-row{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 32px}
.user-name{color:#fff;font-weight:600;font-size:13px;line-height:1.2}
.user-role{color:#8194ba;font-size:11px;letter-spacing:.05em}
.signout{margin-top:10px;background:none;border:1px solid #223662;color:#c7d0e3;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:var(--sans)}
.app-main{flex:1;padding:26px 34px;min-width:0;padding-bottom:120px}
.eyebrow{font-size:11px;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase}
h1.page{font-family:var(--serif);font-size:25px;margin:2px 0 14px}
h3.card-title{font-family:var(--serif);font-size:17px;margin:2px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-md);margin-bottom:18px}
.card table thead tr th{font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;color:var(--ink-soft);font-size:11px}
.data-table td{padding:12px 6px;border-bottom:1px solid #eef1f6;vertical-align:top}
.sub-line{font-size:11.5px;color:var(--ink-soft)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.badge-approved{background:#dff3ee;color:var(--teal-dark)}
.badge-processing{background:#e6ecfb;color:#3457d5}
.badge-draft{background:var(--amber-bg);color:#8a6412}
.badge-conflict{background:#fbe9e7;color:var(--danger)}
.btn{border:none;border-radius:var(--radius-sm);padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:background-color .15s,box-shadow .15s,transform .05s,opacity .15s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-primary{background:var(--navy);color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover:not(:disabled){background:var(--navy-2)}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover:not(:disabled){background:var(--teal-dark)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.banner-amber{background:var(--amber-bg);border:1px solid var(--amber-line);color:#7a5a12;border-radius:var(--radius-sm);padding:12px 14px;font-size:12.5px;margin-bottom:18px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat-card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--teal);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm)}
.stat-card.qa{border-top-color:#b8860b}
.stat-label{font-size:10.5px;letter-spacing:.05em;color:var(--ink-soft)}
.stat-value{font-family:var(--serif);font-size:28px;margin:4px 0 2px}
.stat-note{font-size:11px;color:var(--ink-soft)}
.detail-grid{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eef1f6;font-size:13px}
.kv b{font-weight:600;text-align:right}
.kv span{color:var(--ink-soft)}
.doc-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eef1f6;font-size:13px}
.progress{height:8px;background:#e6ecf3;border-radius:99px;overflow:hidden;margin:8px 0}
.progress>i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .6s ease}
.flag-chip{display:inline-block;background:var(--amber-bg);border:1px solid var(--amber-line);color:#8a6412;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;margin:2px 4px 2px 0}
.conflict-box{background:#fdf6ec;border:1px solid var(--amber-line);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;margin:10px 0}
.finding{padding:10px 0;border-bottom:1px solid #eef1f6;font-size:13.5px}
.finding .cite{font-size:11.5px;color:var(--ink-soft)}
.cite-ok{color:var(--teal-dark);font-weight:600}
.scorecard{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.score-chip{background:#dff3ee;color:var(--teal-dark);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
.report-sec{margin-bottom:16px}
.report-sec h4{font-family:var(--serif);font-size:15.5px;margin:0 0 6px}
.report-sec p{font-size:13.5px;margin:0 0 6px;color:#22304d}
.draft-banner{background:var(--amber-bg);border:1px solid var(--amber-line);color:#8a6412;border-radius:var(--radius-sm);padding:10px 14px;font-weight:600;font-size:13px;margin-bottom:14px;text-align:center;letter-spacing:.03em}
.approved-banner{background:#dff3ee;border:1px solid #bfe6da;color:var(--teal-dark);border-radius:var(--radius-sm);padding:10px 14px;font-weight:600;font-size:13px;margin-bottom:14px;text-align:center}
/* ===== Exact report format (mirrors medexec-app report page + PDF) ===== */
.report-sheet{background:#fff;max-width:760px;margin:0 auto;padding:48px;border-radius:8px;border:1px solid var(--line);color:#1a1a1a;box-shadow:var(--shadow-md)}
.rs-head{text-align:center;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--navy)}
.rs-brand{font-family:var(--serif);font-weight:700;font-size:20px}
.rs-tagline{font-size:10px;letter-spacing:.06em;color:var(--teal-dark)}
.rs-doctitle{font-family:var(--serif);font-size:15px;margin-top:8px}
.rs-title{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--navy);margin-top:6px}
.rs-conf{font-size:9.5px;color:var(--ink-soft);margin-top:4px}
.rs-h{font-family:var(--serif);font-size:14.5px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:5px;margin:22px 0 10px;color:var(--navy)}
.rs-subh{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--navy);margin:12px 0 4px}
.rs-fields{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.rs-field{font-size:12.5px;margin-bottom:10px}
.rs-label{color:var(--ink-soft);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:2px}
.rs-p{font-size:13px;line-height:1.6;margin:0 0 6px}
.rs-cite{color:#3457D5;font-weight:600;font-size:11.5px}
.rs-note{font-size:11px;color:var(--ink-soft);font-style:italic;line-height:1.5}
.rs-table{width:100%;border-collapse:collapse;font-size:12px}
.rs-table th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;color:var(--ink-soft);font-size:10.5px}
.rs-table td{padding:8px;border-bottom:1px solid #EEF1F6;vertical-align:top}
.rs-card{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;font-size:12.5px}
.rs-foot{border-top:1px solid var(--line);margin-top:30px;padding-top:12px;font-size:10.5px;color:var(--ink-soft);display:flex;justify-content:space-between}

   expert-opinion-render.ts at c99a7d4): report sheet, EXPERT OPINION
   doctitle, A. Report Identification, Certification and Attestation ===== */
.od-draft{color:#B00020;font-size:11px;text-align:center;font-weight:700;letter-spacing:.03em;margin:0 0 14px}
.two-input{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.input-card{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;background:#fbfcfe}
.input-card h5{margin:0 0 4px;font-size:13.5px}
.input-card p{margin:0;font-size:12.5px;color:var(--ink-soft)}
.ama-flag{background:#fbe9e7;border:1px solid #f0c4bd;color:#8f2f27;border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;margin:12px 0}
textarea.opinion-edit{width:100%;min-height:64px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px;font-family:var(--sans);font-size:13.5px}
.activity-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #eef1f6;font-size:13px}
.activity-row .when{color:var(--ink-soft);font-size:12px;white-space:nowrap}
.guidebar{position:fixed;left:230px;right:0;bottom:0;background:var(--navy);color:#dfe7f5;padding:12px 34px;display:flex;align-items:center;gap:16px;z-index:50;box-shadow:0 -6px 24px rgba(16,27,54,.25)}
.guidebar .g-title{font-size:11px;letter-spacing:.07em;color:#8ce0ce;white-space:nowrap}
.guidebar .g-cap{font-size:13px;flex:1;line-height:1.4}
.guidebar .g-dots{display:flex;gap:6px}
.g-dot{width:9px;height:9px;border-radius:50%;background:#33477a;border:0;cursor:pointer;padding:0}
.g-dot.on{background:var(--teal)}
.g-dot.done{background:#5b7bc0}
.guidebar .btn{padding:8px 14px;font-size:12.5px}
.toast{position:fixed;top:18px;right:18px;background:var(--navy);color:#fff;border-radius:10px;padding:12px 16px;font-size:13px;box-shadow:var(--shadow-md);z-index:99;max-width:360px;display:none}
.toast.err{background:#7c2d24}
.lock-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px}
.lock-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:30px;max-width:420px;box-shadow:var(--shadow-md);text-align:center}
.demo-tag{display:inline-block;background:var(--navy);color:#8ce0ce;font-size:10.5px;letter-spacing:.08em;border-radius:999px;padding:3px 10px;margin-bottom:10px}
@media(max-width:900px){.app-sidebar{display:none}.app-main{padding:18px}.guidebar{left:0}.stat-grid{grid-template-columns:repeat(2,1fr)}.detail-grid,.two-input{grid-template-columns:1fr}}
</style>
</head>

  document.addEventListener("click", function(ev){
    var nav = ev.target.closest("[data-nav]");
    if (nav) { ev.preventDefault(); stopAuto(); var v = nav.getAttribute("data-nav");
      if (v==="guide") { S.view="guide"; } else if (v==="newmatter") { toast("New Matter is disabled in the demo — the walkthrough runs on bundled synthetic data only."); return; }
      else if (v==="charges") { toast("Charges is outside the demo walkthrough."); return; }
      else S.view = v;
      render(); return; }
    var open = ev.target.closest("[data-open]");
    if (open) { ev.preventDefault(); stopAuto(); S.view = "matter:" + open.getAttribute("data-open"); render(); return; }
    var rep = ev.target.closest("[data-report]");
    if (rep) { ev.preventDefault(); stopAuto(); S.view = "report:" + rep.getAttribute("data-report"); render(); return; }
    var opn = ev.target.closest("[data-opinion]");
    if (opn) { ev.preventDefault(); stopAuto(); S.view = "opinion:" + opn.getAttribute("data-opinion"); render(); return; }
    var act = ev.target.closest("[data-activity]");
    if (act) { ev.preventDefault(); stopAuto(); S.view = "activity"; render(); return; }
    var exp = ev.target.closest("[data-export]");
    if (exp) { ev.preventDefault();
      if (!exportGate() && exp.getAttribute("data-export") !== "preview") { toast("Export refused — the opinion is not approved. Approval requires every AMA rating flag dispositioned and a named expert attestation recorded.", true); return; }
      if (exp.getAttribute("data-export") === "preview" && !exportGate()) { toast("Preview generated — watermarked DRAFT — PENDING EXPERT REVIEW, as on the live platform."); return; }
      toast("Demo export — on the live platform this generates the real " + (exp.getAttribute("data-export")==="docx" ? "DOCX" : "PDF") + " file. Synthetic data only."); return; }
    if (ev.target.id === "gNext") { goStep(S.step + 1); return; }
    if (ev.target.id === "gBack") { stopAuto(); goStep(S.step - 1); return; }
    if (ev.target.id === "gAuto") { if (S.auto) { stopAuto(); render(); } else startAuto(); return; }
    var dot = ev.target.closest("[data-step]");
    if (dot) { stopAuto(); goStep(parseInt(dot.getAttribute("data-step"), 10)); return; }
    if (ev.target.id === "genDraftBtn") { S.op.draft = true; render(); toast("Draft generated from Input A + Input B. AMA rating flag raised — approval blocked until the expert rates."); return; }
    if (ev.target.id === "beginReviewBtn") { S.op.inReview = true; render(); return; }
    if (ev.target.id === "attestBtn") {
      var inp = document.getElementById("ratingInput");
      var val = inp ? inp.value.trim() : "";
      if (!val) { toast("Approval refused — the AMA rating flag is still open. The expert must enter the impairment rating before attesting.", true); return; }
      S.op.rating = val; S.op.approved = true; render();
      toast("Approved and attested by Mohammed M. Morgan, M.D. — attestation recorded. Export unlocked."); return; }
    if (ev.target.id === "runAgentBtn") { runAgent(); return; }
    if (ev.target.id === "signOutBtn") { try { localStorage.removeItem("medexec_demo_session"); } catch(e){} window.location.href = "../"; return; }
  });
  /* Session gate — the hidden portal (../) is the only door. */
  var hasSession = false;
  try { hasSession = !!localStorage.getItem("medexec_demo_session"); } catch(e) {}
  if (!hasSession) {
    document.getElementById("lockRoot").style.display = "block";
    document.getElementById("lockRoot").innerHTML = '<div class="lock-wrap"><div class="lock-card"><div class="brand" style="justify-content:center"><div class="brand-mark">M</div><div style="text-align:left"><div class="brand-name" style="color:var(--ink)">MedExec</div><div class="brand-tag" style="color:var(--teal-dark)">EVIDENCE. VERIFIED.</div></div></div><h2 style="font-family:var(--serif);margin:6px 0">Demo access required</h2><p style="font-size:13.5px;color:var(--ink-soft)">This demo is available only to NDA signers through the invitation link. Sign in through the demo portal to continue.</p><a class="btn btn-primary" style="display:inline-block;text-decoration:none" href="../">Go to the Demo Portal</a></div></div>';
  } else {
    document.getElementById("appRoot").style.display = "block";
    render();
  }
}
if (typeof module !== "undefined" && module.exports) {
  module.exports = { MATTERS: MATTERS, STEPS: STEPS, S: S, dashboardHTML: dashboardHTML, mattersHTML: mattersHTML, matterHTML: matterHTML, reportHTML: reportHTML, reportSheetHTML: reportSheetHTML, opinionHTML: opinionHTML, opinionDocHTML: opinionDocHTML, opinionBlocksHTML: opinionBlocksHTML, opinionTextPlain: opinionTextPlain, auditsHTML: auditsHTML, activityHTML: activityHTML, finalHTML: finalHTML, reportsHTML: reportsHTML, guidebarHTML: guidebarHTML, currentViewHTML: currentViewHTML, applyStepSideEffects: applyStepSideEffects, exportGate: exportGate, heroStatus: heroStatus, DEMO_RATING: DEMO_RATING };
}
